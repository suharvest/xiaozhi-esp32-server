# 智控台（manager）模块：manager-web(Java api + Vue) + MySQL + Redis
# 不含 server 服务——xiaozhi-server 用本地源码跑（含自定义 face 代码）
version: '3'
services:
  # manager-api和manager-web模块
  xiaozhi-esp32-server-web:
    # 我们自建的镜像：含 OVS/EdgeLLM 供应商、仓库助手角色模板、/models/probe 探测端点
    # 等全部 changeset。上游 web_latest 一个都没有，别换回去。
    # 构建：docker build -f Dockerfile-web -t seeed/xiaozhi-manager:arm64 .
    image: seeed/xiaozhi-manager:arm64
    container_name: xiaozhi-esp32-server-web
    restart: always
    networks:
      - default
    depends_on:
      xiaozhi-esp32-server-db:
        condition: service_healthy
      xiaozhi-esp32-server-redis:
        condition: service_healthy
    ports:
      # 智控台
      - "8002:8002"
    environment:
      - TZ=Asia/Shanghai
      - SPRING_DATASOURCE_DRUID_URL=jdbc:mysql://xiaozhi-esp32-server-db:3306/xiaozhi_esp32_server?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&nullCatalogMeansCurrent=true&connectTimeout=30000&socketTimeout=30000&autoReconnect=true&failOverReadOnly=false&maxReconnects=10
      - SPRING_DATASOURCE_DRUID_USERNAME=root
      - SPRING_DATASOURCE_DRUID_PASSWORD=123456
      - SPRING_DATA_REDIS_HOST=xiaozhi-esp32-server-redis
      - SPRING_DATA_REDIS_PASSWORD=
      - SPRING_DATA_REDIS_PORT=6379
    volumes:
      # 配置文件目录
      - ./uploadfile:/uploadfile
  # 数据库模块
  xiaozhi-esp32-server-db:
    image: mysql:latest
    container_name: xiaozhi-esp32-server-db
    healthcheck:
      test: [ "CMD", "mysqladmin" ,"ping", "-h", "localhost" ]
      timeout: 45s
      interval: 10s
      retries: 10
    restart: always
    networks:
      - default
    expose:
      - 3306
    ports:
      # 本机开发用：manager-api 跑在宿主上（mvn spring-boot:run）时需要直连 DB。
      # 只绑 127.0.0.1，不对局域网暴露（root 密码是弱口令 123456）。
      - "127.0.0.1:3306:3306"
    volumes:
      - ./mysql/data:/var/lib/mysql
    environment:
      - TZ=Asia/Shanghai
      - MYSQL_ROOT_PASSWORD=123456
      - MYSQL_DATABASE=xiaozhi_esp32_server
      - MYSQL_INITDB_ARGS="--character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci"
  # redis模块
  xiaozhi-esp32-server-redis:
    image: redis:8.0
    expose:
      - 6379
    ports:
      # 同上：本机开发用，只绑 127.0.0.1
      - "127.0.0.1:6379:6379"
    container_name: xiaozhi-esp32-server-redis
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - default
  # MCP 接入点模块
  # 外部 MCP server（如仓管系统的 mcp_pipe.py）连到这里，按 agent 挂载工具。
  # 智控台在「参数管理 → server.mcp_endpoint」里填它的 health 地址后，
  # 会为每个 agent 派生出各自的 ws 接入地址（token = AES(key, agentId)）。
  # 我们的方案要靠它把仓管系统的出入库工具接进来，所以默认部署。
  # 部署说明见 docs/mcp-endpoint-enable.md。
  xiaozhi-esp32-server-mcp-endpoint:
    image: ghcr.nju.edu.cn/xinnan-tech/mcp-endpoint-server:latest
    container_name: xiaozhi-esp32-server-mcp-endpoint
    restart: always
    ports:
      # 注意：填进智控台的地址必须用宿主机的局域网 IP，
      # 不能用容器内网 IP（日志里打印的那个），外部服务连不上。
      - "8004:8004"
    networks:
      - default
networks:
  default:
